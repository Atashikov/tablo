/* =====================================================================
   Даты без времени (ГГГГ-ММ-ДД). Все вычисления в UTC.
   ===================================================================== */

const DAY_MS = 86400000;
const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const MONTHS_NOM = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

const toUTC = (d) => new Date(`${d}T00:00:00.000Z`);
const fromUTC = (date) => date.toISOString().slice(0, 10);
const addDays = (d, n) => fromUTC(new Date(toUTC(d).getTime() + n * DAY_MS));
const weekdayIndex = (d) => (toUTC(d).getUTCDay() + 6) % 7;
const isWeekend = (d) => weekdayIndex(d) >= 5;
const startOfWeek = (d) => addDays(d, -weekdayIndex(d));
const currentWorkWeek = (today) => (isWeekend(today) ? addDays(startOfWeek(today), 7) : startOfWeek(today));
const workWeekDays = (monday) => [0, 1, 2, 3, 4].map((i) => addDays(monday, i));
const overlaps = (aS, aE, bS, bE) => aS <= bE && bS <= aE;

function isISODate(v) {
  if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const t = toUTC(v);
  return !Number.isNaN(t.getTime()) && fromUTC(t) === v;
}

function todayLocal() {
  const n = new Date();
  const p = (x) => String(x).padStart(2, "0");
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
}

function split(d) {
  const [year, month, day] = d.split("-").map(Number);
  return { year, month, day };
}

function formatDayMonth(d) {
  const { day, month } = split(d);
  return `${day} ${MONTHS_GEN[month - 1]}`;
}

function formatPeriod(start, end, withYear = true) {
  const a = split(start);
  const b = split(end);
  const y = withYear ? ` ${b.year}` : "";
  if (start === end) return `${a.day} ${MONTHS_GEN[a.month - 1]}${y}`;
  if (a.year !== b.year) return `${a.day} ${MONTHS_GEN[a.month - 1]} ${a.year} – ${b.day} ${MONTHS_GEN[b.month - 1]} ${b.year}`;
  if (a.month === b.month) return `${a.day}–${b.day} ${MONTHS_GEN[b.month - 1]}${y}`;
  return `${a.day} ${MONTHS_GEN[a.month - 1]} – ${b.day} ${MONTHS_GEN[b.month - 1]}${y}`;
}

const formatWeek = (monday, withYear = true) => formatPeriod(monday, addDays(monday, 4), withYear);

function countWorkdays(start, end) {
  let n = 0;
  for (let d = start; d <= end; d = addDays(d, 1)) if (!isWeekend(d)) n += 1;
  return n;
}

function plural(n, forms) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}

/** Где разместить полосу в сетке Пн–Пт; null — не попадает в неделю. */
function placeInWeek(start, end, monday) {
  const friday = addDays(monday, 4);
  if (end < monday || start > friday) return null;
  const s = start < monday ? monday : start;
  const e = end > friday ? friday : end;
  const first = weekdayIndex(s);
  const last = weekdayIndex(e);
  if (s > e || first > 4 || last > 4) return null;
  return { colStart: first + 1, span: last - first + 1, fromPrev: start < monday, toNext: end > friday };
}

function monthSegments(days) {
  const segs = [];
  days.forEach((d, i) => {
    const { year, month } = split(d);
    const key = `${year}-${month}`;
    const last = segs[segs.length - 1];
    if (last && last.key === key) last.span += 1;
    else segs.push({ key, label: MONTHS_NOM[month - 1], colStart: i + 1, span: 1 });
  });
  return segs;
}

/**
 * Постоянные Zoom ID — всегда есть в списке, в этом порядке.
 * id совпадают с прежними, чтобы уже сохранённые бронирования не потеряли свой Zoom ID.
 */
const PERMANENT_ZOOM = [
  { id: "zoom-01", zoomId: "978 413 3904" },
  { id: "zoom-06", zoomId: "230 352 0291" },
  { id: "zoom-02", zoomId: "354 292 4835" },
  { id: "zoom-03", zoomId: "773 761 0478" },
  { id: "zoom-05", zoomId: "334 046 4438" },
  { id: "zoom-04", zoomId: "276 101 4864" },
  { id: "zoom-07", zoomId: "828 097 8366" },
  { id: "zoom-08", zoomId: "937 210 8146" },
];

const zoomDigits = (z) => String(z || "").replace(/\D/g, "");
const isPlaceholderZoom = (z) => /^0{7}\d{2,4}$/.test(zoomDigits(z));

/**
 * Приводит сохранённый список к актуальному: 8 постоянных ID в заданном порядке,
 * затем дополнительные ID, заведённые вручную. Старые заглушки «000 000 00…» убираются,
 * если ими не пользуется ни одно бронирование.
 */
function reconcileResources(stored, bookings) {
  const list = Array.isArray(stored) ? stored.filter((r) => r && typeof r.id === "string") : [];
  const usedIds = new Set((bookings || []).map((b) => b.zoomResourceId).filter(Boolean));
  const permanentDigits = new Set(PERMANENT_ZOOM.map((p) => zoomDigits(p.zoomId)));
  const taken = new Set();

  const permanent = PERMANENT_ZOOM.map((p, i) => {
    const match = list.find((r) => zoomDigits(r.zoomId) === zoomDigits(p.zoomId));
    let id = p.id;
    if (match) id = match.id;
    else {
      const slot = list.find((r) => r.id === p.id);
      if (slot && !isPlaceholderZoom(slot.zoomId)) id = `zoom-${zoomDigits(p.zoomId)}`;
    }
    taken.add(id);
    return {
      id,
      name: `Zoom ${String(i + 1).padStart(2, "0")}`,
      zoomId: p.zoomId,
      active: match ? match.active !== false : true,
      permanent: true,
    };
  });

  const extras = list
    .filter((r) => !taken.has(r.id) && !permanentDigits.has(zoomDigits(r.zoomId)))
    .filter((r) => !isPlaceholderZoom(r.zoomId) || usedIds.has(r.id))
    .map((r) => ({ id: r.id, name: "Дополнительный", zoomId: String(r.zoomId), active: r.active !== false, permanent: false }));

  return [...permanent, ...extras];
}

const resourceFromDb = (r) => ({ id:r.id, name:r.name, zoomId:r.zoom_id, active:r.active !== false, permanent:r.permanent !== false });
const bookingFromDb = (b) => ({ id:b.id, title:b.title, zoomResourceId:b.zoom_resource_id, startDate:b.start_date, endDate:b.end_date, responsible:b.responsible, comment:b.comment, color:b.color, createdAt:b.created_at, updatedAt:b.updated_at });
const resourceToDb = (r) => ({ id:r.id, name:r.name, zoom_id:r.zoomId, active:r.active !== false, permanent:r.permanent !== false });
const bookingToDb = (b) => ({ id:b.id, title:b.title, zoom_resource_id:b.zoomResourceId || null, start_date:b.startDate, end_date:b.endDate, responsible:b.responsible || null, comment:b.comment || null, color:b.color || DEFAULT_COLOR });

async function api(path, options={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, headers:{...API_HEADERS, ...(options.headers||{})} });
  if (!res.ok) {
    const body = await res.text();
    const err = new Error(body || `HTTP ${res.status}`);
    err.status = res.status; err.body = body;
    throw err;
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function readKey(key) {
  if (key === KEYS.resources) {
    const rows = await api('zoom_resources?select=*&order=created_at.asc');
    return { found:true, value:(rows||[]).map(resourceFromDb) };
  }
  if (key === KEYS.bookings) {
    const rows = await api('bookings?select=*&order=created_at.asc');
    return { found:true, value:(rows||[]).map(bookingFromDb) };
  }
  return {found:false, value:null};
}

async function writeKey(key, value) {
  if (key === KEYS.resources) {
    await api('zoom_resources?on_conflict=id', { method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(value.map(resourceToDb)) });
    return;
  }
  if (key === KEYS.bookings) {
    await api('bookings?on_conflict=id', { method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(value.map(bookingToDb)) });
    return;
  }
}

/** Проверка файла резервной копии. Возвращает очищенные данные или бросает ошибку с понятным текстом. */
function checkBackup(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.resources) || !Array.isArray(raw.bookings)) {
    throw new Error("это не файл расписания Zoom.");
  }
  const resources = raw.resources.map((r, i) => {
    if (!r || typeof r.id !== "string" || typeof r.zoomId !== "string") throw new Error(`Zoom ID №${i + 1} записан неверно.`);
    return { id: r.id, name: typeof r.name === "string" ? r.name : `Zoom ${String(i + 1).padStart(2, "0")}`, zoomId: r.zoomId, active: r.active !== false };
  });
  const resourceIds = new Set(resources.map((r) => r.id));
  const now = new Date().toISOString();
  const bookings = raw.bookings.map((b, i) => {
    const n = i + 1;
    if (!b || typeof b.id !== "string" || typeof b.title !== "string" || !b.title.trim()) throw new Error(`у бронирования №${n} нет названия.`);
    if (!isISODate(b.startDate) || !isISODate(b.endDate) || b.endDate < b.startDate) throw new Error(`у бронирования «${b.title}» неверные даты.`);
    const zoomResourceId = b.zoomResourceId && resourceIds.has(b.zoomResourceId) ? b.zoomResourceId : null;
    return {
      id: b.id,
      title: b.title.trim(),
      zoomResourceId,
      startDate: b.startDate,
      endDate: b.endDate,
      responsible: typeof b.responsible === "string" && b.responsible.trim() ? b.responsible.trim() : null,
      comment: typeof b.comment === "string" && b.comment.trim() ? b.comment.trim() : null,
      color: COLORS[b.color] ? b.color : DEFAULT_COLOR,
      createdAt: typeof b.createdAt === "string" ? b.createdAt : now,
      updatedAt: typeof b.updatedAt === "string" ? b.updatedAt : now,
    };
  });
  return { resources, bookings };
}

async function loadData() {
  const [res, bk] = await Promise.all([readKey(KEYS.resources), readKey(KEYS.bookings)]);
  const resources = reconcileResources(res.value || [], bk.value || []);
  const bookings = Array.isArray(bk.value) ? bk.value : [];
  return { resources, bookings: [...bookings].sort(byCreated) };
}

/* =====================================================================
   Валидация
   ===================================================================== */

const LIMITS = { title: 120, responsible: 120, comment: 1000 };

function validate(form) {
  const errors = {};
  const title = form.title.trim();
  if (!title) errors.title = "Укажите название или подразделение.";
  else if (title.length > LIMITS.title) errors.title = `Не длиннее ${LIMITS.title} символов.`;

  if (!isISODate(form.startDate)) errors.startDate = "Укажите дату начала.";
  else if (isWeekend(form.startDate)) errors.startDate = "Выберите рабочий день (Пн–Пт).";

  if (!isISODate(form.endDate)) errors.endDate = "Укажите дату окончания.";
  else if (isWeekend(form.endDate)) errors.endDate = "Выберите рабочий день (Пн–Пт).";
  else if (isISODate(form.startDate) && form.endDate < form.startDate) errors.endDate = "Дата окончания не может быть раньше даты начала.";

  if (Object.keys(errors).length) return { ok: false, errors };
  return {
    ok: true,
    value: {
      title,
      zoomResourceId: form.zoomResourceId || null,
      startDate: form.startDate,
      endDate: form.endDate,
      responsible: form.responsible.trim() || null,
      comment: form.comment.trim() || null,
      color: COLORS[form.color] ? form.color : DEFAULT_COLOR,
    },
  };
}

  right: "M7.5 4.5 13 10l-5.5 5.5",
  plus: "M10 4.5v11M4.5 10h11",
  close: "m5.5 5.5 9 9M14.5 5.5l-9 9",
};

/* =====================================================================
   Приложение
   ===================================================================== */

function ZoomSchedule() {
  const today = useMemo(() => todayLocal(), []);
  const currentMonday = currentWorkWeek(today);
  const [monday, setMonday] = useState(currentMonday);
  const [data, setData] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [dialog, setDialog] = useState(null);
  const [toast, setToast] = useState(null);
  const fileRef = useRef(null);

  const refresh = useCallback(async () => {
    try {
      const next = await loadData();
      setData(next);
      setLoadError(null);
      return next;
    } catch (e) {
      setLoadError("Не удалось загрузить расписание. Проверьте подключение и обновите страницу.");
      return null;
    }
  }, []);

  // Первая загрузка, обновление раз в 30 секунд и при возврате на вкладку.
  useEffect(() => {
    refresh();
    const timer = setInterval(refresh, 30000);
    const onFocus = () => refresh();
    window.addEventListener("focus", onFocus);
    return () => {
      clearInterval(timer);
      window.removeEventListener("focus", onFocus);
    };
  }, [refresh]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  // Стрелки ← → переключают недели, когда окна закрыты.
  useEffect(() => {
    if (dialog) return;
    const onKey = (e) => {
      if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "ArrowLeft") setMonday((m) => addDays(m, -7));
      if (e.key === "ArrowRight") setMonday((m) => addDays(m, 7));
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [dialog]);

  const resources = data ? data.resources : [];
  const resourceById = useMemo(() => Object.fromEntries(resources.map((r) => [r.id, r])), [resources]);
  const friday = addDays(monday, 4);
  const defaultDay = today >= monday && today <= friday ? today : monday;

  /** Сохранение с проверкой занятости по самым свежим данным хранилища. */
  const saveBooking = useCallback(async (input, id) => {
    try {
      const now = new Date().toISOString();
      const saved = id
        ? { ...(data?.bookings.find((b) => b.id === id) || {id}), ...input, updatedAt: now }
        : { id: newId(), ...input, createdAt: now, updatedAt: now };
      const row = bookingToDb(saved);
      if (id) {
        await api(`bookings?id=eq.${encodeURIComponent(id)}`, { method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify(row) });
      } else {
        await api('bookings', { method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify(row) });
      }
      await refresh();
      return { saved };
    } catch (e) {
      if ((e.body || '').includes('bookings_no_overlap') || (e.body || '').includes('23P01')) {
        const latest = await readKey(KEYS.bookings);
        const clash = (latest.value || []).find((b) => b.id !== id && b.zoomResourceId === input.zoomResourceId && overlaps(b.startDate,b.endDate,input.startDate,input.endDate));
        return { conflict: clash || { title:'Другое бронирование', startDate:input.startDate, endDate:input.endDate } };
      }
      return { error: 'Не удалось сохранить бронирование. Проверьте интернет и повторите попытку.' };
    }
  }, [data, refresh]);

  const deleteBooking = useCallback(async (id) => {
    await api(`bookings?id=eq.${encodeURIComponent(id)}`, { method:'DELETE', headers:{Prefer:'return=minimal'} });
    await refresh();
  }, [refresh]);

  const saveResources = useCallback(async (edited) => {
    const next = reconcileResources(edited, data?.bookings || []);
    await writeKey(KEYS.resources, next);
    await refresh();
  }, [data, refresh]);

  function exportData() {
    if (!data) return;
    const payload = {
      app: "zoom-schedule",
      version: 1,
      exportedAt: new Date().toISOString(),
      resources: data.resources,
      bookings: data.bookings,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `raspisanie-zoom-${today}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setToast("Копия скачана");
  }

  async function onFileChosen(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const payload = checkBackup(JSON.parse(await file.text()));
      setDialog({ kind: "import", payload, fileName: file.name });
    } catch (err) {
      const reason = err instanceof SyntaxError ? "файл повреждён или это не JSON." : err.message;
      setDialog({ kind: "import-error", reason });
    }
  }

  async function importData(payload) {
    const nextResources = reconcileResources(payload.resources, payload.bookings);
    await writeKey(KEYS.resources, nextResources);
    await api('bookings?id=not.is.null', { method:'DELETE', headers:{Prefer:'return=minimal'} });
    if (payload.bookings.length) await writeKey(KEYS.bookings, payload.bookings);
    await refresh();
  }

  function handleSaved(saved, isEdit) {
    setDialog(null);
    setToast(isEdit ? "Изменения сохранены" : "Забронировано");
    if (!placeInWeek(saved.startDate, saved.endDate, monday)) setMonday(startOfWeek(saved.startDate));
  }

  return (
    <div className="zs">
      <style>{CSS}</style>
      <main className="mx-auto px-4 py-6 sm:px-8 sm:py-8" style={{ maxWidth: 1280 }}>
        <Header
          monday={monday}
          isCurrentWeek={monday === currentMonday}
          onPrev={() => setMonday(addDays(monday, -7))}
          onNext={() => setMonday(addDays(monday, 7))}
          onToday={() => setMonday(currentMonday)}
          onAdd={() => setDialog({ kind: "create", start: defaultDay, end: defaultDay })}
          disabled={!data}
        />

        {STORAGE_MODE === "memory" && (
          <div role="alert" className="mb-4 rounded-lg px-4 py-3 text-sm" style={{ background: "#FFF6DB", border: "1px solid #EFD98A", color: "#5A4700" }}>
            <strong className="font-semibold">Изменения не сохранятся после перезагрузки.</strong>{" "}
            Здесь браузер запрещает хранить данные. Скачайте файл страницы и откройте его в Chrome или Edge
            либо перед закрытием нажмите «Скачать копию» внизу.
          </div>
        )}

        {loadError && (
          <p role="alert" className="mb-4 rounded-lg px-4 py-3 text-sm" style={{ background: "#FBEAE8", color: "#8F2A24" }}>
            {loadError}
          </p>
        )}

        {!data && !loadError && (
          <div className="rounded-xl border bg-white py-24 text-center text-sm" style={{ borderColor: LINE, color: MUTED }}>
            Загружаем расписание…
          </div>
        )}

        {data && (
          <WeekGrid
            monday={monday}
            today={today}
            bookings={data.bookings}
            resourceById={resourceById}
            onOpen={(b) => setDialog({ kind: "view", booking: b })}
            onCreateAt={(d) => setDialog({ kind: "create", start: d, end: d })}
          />
        )}

        {data && (
          <footer className="mt-4 flex flex-wrap items-center justify-between gap-3 text-xs" style={{ color: MUTED }}>
            <span style={{ maxWidth: 560 }}>{STORAGE_NOTE[STORAGE_MODE]}</span>
            <span className="flex flex-wrap items-center gap-1">
              <button type="button" className="zs-link" onClick={exportData}>
                Скачать копию
              </button>
              <button type="button" className="zs-link" onClick={() => fileRef.current && fileRef.current.click()}>
                Загрузить из файла
              </button>
              <button type="button" className="zs-link" onClick={() => setDialog({ kind: "resources" })}>
                Настроить Zoom ID
              </button>
            </span>
            <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFileChosen} style={{ display: "none" }} />
          </footer>
        )}
      </main>

      {dialog && dialog.kind === "create" && (
        <BookingForm
          resources={resources}
          bookings={data.bookings}
          defaultStart={dialog.start}
          defaultEnd={dialog.end}
          onClose={() => setDialog(null)}
          onSubmit={saveBooking}
          onSaved={(b) => handleSaved(b, false)}
          resourceById={resourceById}
        />
      )}
      {dialog && dialog.kind === "edit" && (
        <BookingForm
          resources={resources}
          bookings={data.bookings}
          booking={dialog.booking}
          defaultStart={dialog.booking.startDate}
          defaultEnd={dialog.booking.endDate}
          onClose={() => setDialog(null)}
          onSubmit={saveBooking}
          onSaved={(b) => handleSaved(b, true)}
          resourceById={resourceById}
        />
      )}
      {dialog && dialog.kind === "view" && (
        <BookingDetails
          booking={dialog.booking}
          resource={resourceById[dialog.booking.zoomResourceId]}
          onClose={() => setDialog(null)}
          onEdit={() => setDialog({ kind: "edit", booking: dialog.booking })}
          onDelete={() => setDialog({ kind: "delete", booking: dialog.booking })}
        />
      )}
      {dialog && dialog.kind === "delete" && (
        <ConfirmDelete
          booking={dialog.booking}
          resource={resourceById[dialog.booking.zoomResourceId]}
          onCancel={() => setDialog(null)}
          onConfirm={deleteBooking}
          onDeleted={() => {
            setDialog(null);
            setToast("Бронирование удалено");
          }}
        />
      )}
      {dialog && dialog.kind === "resources" && (
        <ResourcesDialog
          resources={resources}
          bookings={data.bookings}
          onClose={() => setDialog(null)}
          onSave={saveResources}
          onSaved={() => {
            setDialog(null);
            setToast("Zoom ID сохранены");
          }}
        />
      )}

      {dialog && dialog.kind === "import" && (
        <ConfirmImport
          payload={dialog.payload}
          fileName={dialog.fileName}
          onCancel={() => setDialog(null)}
          onConfirm={importData}
          onDone={() => {
            setDialog(null);
            setToast("Данные загружены");
          }}
        />
      )}
      {dialog && dialog.kind === "import-error" && (
        <Modal title="Не удалось загрузить файл" onClose={() => setDialog(null)} width={400} role="alertdialog">
          <p className="px-6 pt-2 text-sm" style={{ paddingBottom: 20, margin: 0 }}>
            Файл не подошёл: {dialog.reason} Выберите файл, скачанный кнопкой «Скачать копию».
          </p>
          <ModalFooter>
            <button type="button" className="zs-btn zs-primary" onClick={() => setDialog(null)} data-autofocus>
              Понятно
            </button>
          </ModalFooter>
        </Modal>
      )}

      {toast && (
        <div className="fixed inset-x-0 flex justify-center" style={{ bottom: 24, zIndex: 60, pointerEvents: "none" }}>
          <div role="status" className="zs-toast rounded-lg px-4 py-2 text-sm text-white shadow-lg" style={{ background: INK }}>
            {toast}
          </div>
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   Шапка
   ===================================================================== */

function Header({ monday, isCurrentWeek, onPrev, onNext, onToday, onAdd, disabled }) {
  return (
    <header className="mb-5">
      <div className="flex flex-col items-center gap-4 sm:flex-row sm:items-end">
        <div className="hidden flex-1 sm:block" />
        <div className="text-center">
          <h1 className="font-semibold" style={{ fontSize: 28, lineHeight: 1.2, letterSpacing: "-0.01em", margin: 0 }}>
            Расписание Zoom
          </h1>
          <p className="tab mt-1 text-lg" style={{ color: MUTED, margin: "4px 0 0" }}>
            {formatWeek(monday)}
          </p>
        </div>
        <div className="flex flex-1 justify-end">
          <button type="button" className="zs-btn zs-primary" onClick={onAdd} disabled={disabled} style={{ paddingLeft: 14, paddingRight: 14 }}>
            <Icon d={ICONS.plus} size={18} />
            Добавить бронирование
          </button>
        </div>
      </div>

      <nav aria-label="Переключение недель" className="mt-5 flex items-center justify-between gap-2">
        <button type="button" className="zs-nav" onClick={onPrev} title="Предыдущая неделя (←)">
          <Icon d={ICONS.left} />
          <span className="tab zs-nav-label">{formatWeek(addDays(monday, -7), false)}</span>
        </button>
        <button type="button" className="zs-pill" onClick={onToday} disabled={isCurrentWeek}>
          {isCurrentWeek ? "Эта неделя" : "Сегодня"}
        </button>
        <button type="button" className="zs-nav" onClick={onNext} title="Следующая неделя (→)">
          <span className="tab zs-nav-label">{formatWeek(addDays(monday, 7), false)}</span>
          <Icon d={ICONS.right} />
        </button>
      </nav>
    </header>
  );
}

/* =====================================================================
   Сетка недели
   ===================================================================== */

const MIN_ROWS = 8;

function WeekGrid({ monday, today, bookings, resourceById, onOpen, onCreateAt }) {
  const days = workWeekDays(monday);
  const months = monthSegments(days);
  const todayIndex = days.indexOf(today);

  const rows = [];
  for (const b of bookings) {
    const p = placeInWeek(b.startDate, b.endDate, monday);
    if (p) rows.push({ booking: b, placement: p });
  }
  const emptyRows = Math.max(MIN_ROWS - rows.length, 1);
  const borderR = (i) => (i < 4 ? `1px solid ${LINE}` : "none");

  return (
    <section aria-label="Бронирования на неделю" className="overflow-x-auto rounded-xl border bg-white" style={{ borderColor: LINE, boxShadow: "0 1px 2px rgba(27,36,48,.05)" }}>
      <div style={{ minWidth: 860 }}>
        <div className="grid grid-cols-5" style={{ borderBottom: `1px solid ${LINE}` }}>
          {months.map((m) => (
            <div
              key={m.key}
              className="px-4 py-2 text-center font-medium"
              style={{ gridColumn: `${m.colStart} / span ${m.span}`, fontSize: 15, color: MUTED, borderRight: m.colStart + m.span <= 5 ? `1px solid ${LINE}` : "none" }}
            >
              {m.label}
            </div>
          ))}
        </div>

        <div className="grid grid-cols-5" style={{ borderBottom: `2px solid ${LINE}` }}>
          {days.map((d, i) => {
            const isToday = i === todayIndex;
            return (
              <div key={d} aria-current={isToday ? "date" : undefined} className="px-4 text-center" style={{ borderRight: borderR(i), background: isToday ? ACCENT_SOFT : undefined, paddingTop: 12, paddingBottom: 10 }}>
                <div className="tab font-semibold" style={{ fontSize: 26, lineHeight: 1, color: isToday ? ACCENT : INK }}>
                  {split(d).day}
                </div>
                <div className="text-sm" style={{ marginTop: 6, color: isToday ? ACCENT : MUTED }}>
                  {WEEKDAYS[i]}
                </div>
              </div>
            );
          })}
        </div>

        <div className="relative">
          <div aria-hidden="true" className="absolute inset-0 grid grid-cols-5" style={{ pointerEvents: "none" }}>
            {days.map((d, i) => (
              <div key={d} style={{ borderRight: borderR(i), background: i === todayIndex ? "rgba(237,243,252,.6)" : undefined }} />
            ))}
          </div>

          <div className="relative">
            {rows.map(({ booking, placement }) => (
              <div key={booking.id} className="grid grid-cols-5" style={{ borderBottom: "1px solid rgba(223,227,233,.7)" }}>
                <EmptyCells days={days} onCreateAt={onCreateAt} />
                <BookingCard booking={booking} placement={placement} resource={resourceById[booking.zoomResourceId]} onOpen={onOpen} />
              </div>
            ))}
            {Array.from({ length: emptyRows }, (_, i) => (
              <div key={`empty-${i}`} className="grid grid-cols-5" style={{ borderBottom: i < emptyRows - 1 ? "1px solid rgba(223,227,233,.7)" : "none" }}>
                <EmptyCells days={days} onCreateAt={onCreateAt} />
              </div>
            ))}
          </div>

          {rows.length === 0 && (
            <div className="absolute inset-x-0 text-center" style={{ top: 24, pointerEvents: "none" }}>
              <p className="inline-block rounded-lg px-4 py-2 text-sm" style={{ background: "rgba(255,255,255,.92)", color: MUTED, margin: 0 }}>
                На этой неделе бронирований нет. Нажмите на любой день, чтобы добавить.
              </p>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function EmptyCells({ days, onCreateAt }) {
  return days.map((d, i) => (
    <button key={d} type="button" tabIndex={-1} className="zs-cell" style={{ gridRow: 1, gridColumn: i + 1 }} onClick={() => onCreateAt(d)} aria-label={`Добавить бронирование на ${formatDayMonth(d)}`}>
      <span className="zs-plus">+</span>
    </button>
  ));
}

function BookingCard({ booking, placement, resource, onOpen }) {
  const c = getColor(booking.color);
  const { colStart, span, fromPrev, toNext } = placement;
  const zoomId = resource ? resource.zoomId : null;
  const period = formatPeriod(booking.startDate, booking.endDate);
  const r = 6;

  return (
    <button
      type="button"
      className="zs-card relative flex items-center text-left"
      onClick={() => onOpen(booking)}
      title={`${booking.title}\n${period}${zoomId ? `\nZoom ID: ${zoomId}` : ""}`}
      aria-label={`${booking.title}, ${period}${zoomId ? `, Zoom ID ${zoomId}` : ""}`}
      style={{
        gridRow: 1,
        gridColumn: `${colStart} / span ${span}`,
        zIndex: 10,
        minWidth: 0,
        gap: 6,
        margin: `5px ${toNext ? 0 : 5}px 5px ${fromPrev ? 0 : 5}px`,
        padding: `6px ${toNext ? 6 : 12}px 6px ${fromPrev ? 6 : 12}px`,
        background: c.bg,
        color: c.text,
        border: `1px solid ${c.border}`,
        borderLeftWidth: fromPrev ? 0 : 1,
        borderRightWidth: toNext ? 0 : 1,
        borderRadius: `${fromPrev ? 0 : r}px ${toNext ? 0 : r}px ${toNext ? 0 : r}px ${fromPrev ? 0 : r}px`,
      }}
    >
      {fromPrev && <span style={{ opacity: 0.6 }}><Icon d={ICONS.left} size={14} /></span>}
      <span style={{ minWidth: 0, flex: 1 }}>
        <span className="block truncate font-semibold" style={{ fontSize: 13.5, lineHeight: "20px" }}>
          {booking.title}
        </span>
        {zoomId && (
          <span className="tab block truncate" style={{ fontSize: 12, lineHeight: "16px", opacity: 0.8 }}>
            Zoom ID: {zoomId}
          </span>
        )}
      </span>
      {toNext && <span style={{ opacity: 0.6 }}><Icon d={ICONS.right} size={14} /></span>}
    </button>
  );
}

/* =====================================================================
   Модальные окна
   ===================================================================== */

function Modal({ title, onClose, children, accentColor, width = 460, role = "dialog" }) {
  const titleId = useId();
  const panelRef = useRef(null);
  const closeRef = useRef(onClose);
  useEffect(() => {
    closeRef.current = onClose;
  });

  useEffect(() => {
    const prevFocus = document.activeElement;
    const panel = panelRef.current;
    const target = panel && (panel.querySelector("[data-autofocus]") || panel.querySelector("input, select, textarea, button"));
    if (target) target.focus();
    const onKey = (e) => {
      if (e.key === "Escape") closeRef.current();
    };
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("keydown", onKey);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus();
    };
  }, []);

  return (
    <div
      className="fixed inset-0 flex items-start justify-center overflow-y-auto p-4 sm:items-center sm:p-6"
      style={{ background: "rgba(27,36,48,.35)", zIndex: 50 }}
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div ref={panelRef} role={role} aria-modal="true" aria-labelledby={titleId} className="zs-dialog relative w-full overflow-hidden rounded-xl bg-white" style={{ maxWidth: width, boxShadow: "0 12px 40px rgba(27,36,48,.22)" }}>
        {accentColor && <div style={{ height: 6, background: accentColor }} />}
        <div className="flex items-start justify-between gap-4 px-6 pt-5" style={{ paddingBottom: 4 }}>
          <h2 id={titleId} className="text-lg font-semibold" style={{ margin: 0, lineHeight: 1.35 }}>
            {title}
          </h2>
          <button type="button" className="zs-close" onClick={onClose} aria-label="Закрыть" style={{ marginRight: -8, marginTop: -4 }}>
            <Icon d={ICONS.close} size={18} />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ModalFooter({ children, between = false }) {
  return (
    <div className={`flex items-center gap-2 border-t px-6 py-4 ${between ? "justify-between" : "justify-end"}`} style={{ borderColor: LINE, background: "#FAFBFC" }}>
      {children}
    </div>
  );
}

/** Enter в однострочном поле сохраняет, как в обычной форме. */
function submitOnEnter(e, action) {
  const t = e.target;
  if (e.key !== "Enter" || e.shiftKey || e.nativeEvent.isComposing) return;
  if (!t || t.tagName !== "INPUT" || ["checkbox", "radio", "button"].includes(t.type)) return;
  e.preventDefault();
  action();
}

function Field({ id, label, error, children }) {
  return (
    <div>
      <label htmlFor={id} className="zs-label">
        {label}
      </label>
      {children}
      {error && <p className="zs-error" style={{ marginBottom: 0 }}>{error}</p>}
    </div>
  );
}

function ConflictNotice({ booking, resource }) {
  const c = getColor(booking.color);
  return (
    <div role="alert" className="rounded-lg p-3" style={{ border: "1px solid #F0C5C1", background: "#FDF1F0" }}>
      <p className="text-sm font-medium" style={{ color: "#8F2A24", margin: 0 }}>
        Этот Zoom ID уже занят в выбранный период.
      </p>
      <div className="mt-2 rounded-md px-3 py-2" style={{ background: c.bg, border: `1px solid ${c.border}`, color: c.text }}>
        <p className="text-sm font-semibold" style={{ margin: 0 }}>{booking.title}</p>
        <p className="tab" style={{ fontSize: 13, margin: 0, opacity: 0.85 }}>
          {formatPeriod(booking.startDate, booking.endDate)}
          {resource ? `, Zoom ID ${resource.zoomId}` : ""}
        </p>
        {booking.responsible && (
          <p style={{ fontSize: 13, margin: 0, opacity: 0.85 }}>Ответственный: {booking.responsible}</p>
        )}
      </div>
      <p className="mt-2" style={{ fontSize: 13, color: "#8F2A24", marginBottom: 0 }}>
        Выберите другой Zoom ID или другие даты.
      </p>
    </div>
  );
}

function BookingForm({ resources, bookings, booking, defaultStart, defaultEnd, onClose, onSubmit, onSaved, resourceById }) {
  const isEdit = Boolean(booking);
  const ids = useId();
  const [form, setForm] = useState(() =>
    booking
      ? {
          title: booking.title,
          zoomResourceId: booking.zoomResourceId || "",
          startDate: booking.startDate,
          endDate: booking.endDate,
          responsible: booking.responsible || "",
          comment: booking.comment || "",
          color: COLORS[booking.color] ? booking.color : DEFAULT_COLOR,
        }
      : { title: "", zoomResourceId: "", startDate: defaultStart, endDate: defaultEnd, responsible: "", comment: "", color: DEFAULT_COLOR }
  );
  const [errors, setErrors] = useState({});
  const [serverConflict, setServerConflict] = useState(null);
  const [serverError, setServerError] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const datesValid = isISODate(form.startDate) && isISODate(form.endDate) && form.startDate <= form.endDate;

  // Какие Zoom ID заняты на выбранные даты (по текущим данным).
  const busy = useMemo(() => {
    const map = {};
    if (!datesValid) return map;
    for (const b of [...bookings].sort((a, c) => (a.startDate < c.startDate ? -1 : 1))) {
      if (!b.zoomResourceId || (booking && b.id === booking.id)) continue;
      if (!map[b.zoomResourceId] && overlaps(b.startDate, b.endDate, form.startDate, form.endDate)) map[b.zoomResourceId] = b;
    }
    return map;
  }, [bookings, booking, datesValid, form.startDate, form.endDate]);

  const liveConflict = form.zoomResourceId ? busy[form.zoomResourceId] || null : null;
  const conflict = serverConflict || liveConflict;
  const options = resources.filter((r) => r.active || (booking && r.id === booking.zoomResourceId));

  function update(field, value) {
    setForm((prev) => {
      const next = { ...prev, [field]: value };
      if (field === "startDate" && isISODate(value) && (!isISODate(prev.endDate) || prev.endDate < value)) next.endDate = value;
      return next;
    });
    setErrors((prev) => ({ ...prev, [field]: undefined }));
    setServerConflict(null);
    setServerError(null);
  }

  async function handleSubmit() {
    if (submitting) return;
    const result = validate(form);
    if (!result.ok) {
      setErrors(result.errors);
      return;
    }
    const resource = result.value.zoomResourceId ? resourceById[result.value.zoomResourceId] : null;
    if (result.value.zoomResourceId && (!resource || (!resource.active && booking?.zoomResourceId !== resource.id))) {
      setErrors({ zoomResourceId: "Этот Zoom ID недоступен. Выберите другой." });
      return;
    }
    setSubmitting(true);
    try {
      const res = await onSubmit(result.value, booking ? booking.id : null);
      if (res.saved) onSaved(res.saved);
      else if (res.conflict) setServerConflict(res.conflict);
      else setServerError(res.error || "Не удалось сохранить. Попробуйте ещё раз.");
    } catch (err) {
      setServerError("Не удалось сохранить: нет связи с хранилищем. Попробуйте ещё раз.");
    } finally {
      setSubmitting(false);
    }
  }

  const workdays = datesValid ? countWorkdays(form.startDate, form.endDate) : 0;

  return (
    <Modal title={isEdit ? "Изменить бронирование" : "Новое бронирование"} onClose={onClose} accentColor={COLORS[form.color].border}>
      {/* Без HTML-формы: в защищённом окне просмотра её отправка заблокирована. */}
      <div onKeyDown={(e) => submitOnEnter(e, handleSubmit)}>
        <div className="space-y-4 px-6 pt-3" style={{ paddingBottom: 8 }}>
          <Field id={`${ids}-t`} label="Название / подразделение" error={errors.title}>
            <input id={`${ids}-t`} data-autofocus className={`zs-input ${errors.title ? "err" : ""}`} value={form.title} maxLength={LIMITS.title} placeholder="Например, ПТМ" autoComplete="off" onChange={(e) => update("title", e.target.value)} />
          </Field>

          <Field id={`${ids}-z`} label="Zoom ID" error={errors.zoomResourceId}>
            <select id={`${ids}-z`} className={`zs-input tab ${errors.zoomResourceId ? "err" : ""}`} value={form.zoomResourceId} onChange={(e) => update("zoomResourceId", e.target.value)}>
              <option value="">Без Zoom ID</option>
              {options.map((r) => (
                <option key={r.id} value={r.id}>
                  {r.zoomId}
                  {busy[r.id] ? " (занят)" : ""}
                </option>
              ))}
            </select>
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field id={`${ids}-s`} label="Дата начала" error={errors.startDate}>
              <input id={`${ids}-s`} type="date" lang="ru" className={`zs-input tab ${errors.startDate ? "err" : ""}`} value={form.startDate} onChange={(e) => update("startDate", e.target.value)} />
            </Field>
            <Field id={`${ids}-e`} label="Дата окончания" error={errors.endDate}>
              <input id={`${ids}-e`} type="date" lang="ru" className={`zs-input tab ${errors.endDate ? "err" : ""}`} value={form.endDate} min={isISODate(form.startDate) ? form.startDate : undefined} onChange={(e) => update("endDate", e.target.value)} />
            </Field>
          </div>

          {datesValid && !errors.startDate && !errors.endDate && (
            <p className="text-sm" style={{ color: MUTED, marginTop: 8 }}>
              {formatPeriod(form.startDate, form.endDate)}, {workdays} {plural(workdays, ["рабочий день", "рабочих дня", "рабочих дней"])}
            </p>
          )}

          {conflict && <ConflictNotice booking={conflict} resource={resourceById[conflict.zoomResourceId]} />}

          <Field id={`${ids}-r`} label="Ответственный">
            <input id={`${ids}-r`} className="zs-input" value={form.responsible} maxLength={LIMITS.responsible} onChange={(e) => update("responsible", e.target.value)} />
          </Field>

          <Field id={`${ids}-c`} label="Комментарий">
            <textarea id={`${ids}-c`} className="zs-input" rows={2} style={{ resize: "vertical" }} value={form.comment} maxLength={LIMITS.comment} onChange={(e) => update("comment", e.target.value)} />
          </Field>

          <div>
            <span className="zs-label" id={`${ids}-cl`}>Цвет</span>
            <div role="radiogroup" aria-labelledby={`${ids}-cl`} className="flex flex-wrap gap-2">
              {COLOR_KEYS.map((k) => {
                const c = COLORS[k];
                const selected = form.color === k;
                return (
                  <button
                    key={k}
                    type="button"
                    role="radio"
                    aria-checked={selected}
                    aria-label={c.label}
                    title={c.label}
                    onClick={() => update("color", k)}
                    style={{
                      width: 28,
                      height: 28,
                      borderRadius: 6,
                      background: c.bg,
                      border: `1px solid ${c.border}`,
                      boxShadow: selected ? `0 0 0 2px #fff, 0 0 0 4px ${INK}` : "none",
                      cursor: "pointer",
                      padding: 0,
                    }}
                  />
                );
              })}
            </div>
          </div>

          {serverError && !conflict && (
            <p role="alert" className="rounded-lg px-3 py-2 text-sm" style={{ background: "#FBEAE8", color: "#8F2A24" }}>
              {serverError}
            </p>
          )}
        </div>

        <div style={{ marginTop: 12 }}>
          <ModalFooter>
            <button type="button" className="zs-btn zs-secondary" onClick={onClose}>
              Отмена
            </button>
            <button type="button" className="zs-btn zs-primary" onClick={handleSubmit} disabled={submitting || Boolean(conflict)}>
              {submitting ? "Сохраняем…" : isEdit ? "Сохранить изменения" : "Забронировать"}
            </button>
          </ModalFooter>
        </div>
      </div>
    </Modal>
  );
}

function BookingDetails({ booking, resource, onClose, onEdit, onDelete }) {
  const c = getColor(booking.color);
  const Row = ({ label, children }) => (
    <div>
      <dt style={{ fontSize: 13, color: MUTED }}>{label}</dt>
      <dd style={{ margin: "2px 0 0", fontSize: 15 }}>{children}</dd>
    </div>
  );
  const none = (text) => <span style={{ color: MUTED }}>{text}</span>;

  return (
    <Modal title={booking.title} onClose={onClose} accentColor={c.border}>
      <dl className="space-y-3 px-6 pt-3" style={{ paddingBottom: 20, margin: 0 }}>
        <Row label="Zoom ID">{resource ? <span className="tab font-medium" style={{ fontSize: 17 }}>{resource.zoomId}</span> : none("Не указан")}</Row>
        <Row label="Период"><span className="tab">{formatPeriod(booking.startDate, booking.endDate)}</span></Row>
        <Row label="Ответственный">{booking.responsible || none("Не указан")}</Row>
        <Row label="Комментарий">{booking.comment ? <span style={{ whiteSpace: "pre-wrap" }}>{booking.comment}</span> : none("Нет")}</Row>
      </dl>
      <ModalFooter between>
        <button type="button" className="zs-btn zs-danger-ghost" onClick={onDelete}>
          Удалить
        </button>
        <div className="flex gap-2">
          <button type="button" className="zs-btn zs-secondary" onClick={onClose}>
            Закрыть
          </button>
          <button type="button" className="zs-btn zs-primary" onClick={onEdit} data-autofocus>
            Изменить
          </button>
        </div>
      </ModalFooter>
    </Modal>
  );
}

function ConfirmDelete({ booking, resource, onCancel, onConfirm, onDeleted }) {
  const [deleting, setDeleting] = useState(false);
  const [error, setError] = useState(null);

  async function handleDelete() {
    setDeleting(true);
    setError(null);
    try {
      await onConfirm(booking.id);
      onDeleted();
    } catch (e) {
      setError("Не удалось удалить: нет связи с хранилищем. Попробуйте ещё раз.");
      setDeleting(false);
    }
  }

  return (
    <Modal title="Удалить это бронирование?" onClose={onCancel} width={384} role="alertdialog">
      <div className="px-6 pt-2" style={{ paddingBottom: 20, fontSize: 15 }}>
        <p className="font-medium" style={{ margin: 0 }}>{booking.title}</p>
        <p className="tab text-sm" style={{ color: MUTED, margin: 0 }}>
          {formatPeriod(booking.startDate, booking.endDate)}
          {resource ? `, Zoom ID ${resource.zoomId}` : ""}
        </p>
        {error && (
          <p role="alert" className="mt-3 rounded-lg px-3 py-2 text-sm" style={{ background: "#FBEAE8", color: "#8F2A24", marginBottom: 0 }}>
            {error}
          </p>
        )}
      </div>
      <ModalFooter>
        <button type="button" className="zs-btn zs-secondary" onClick={onCancel} data-autofocus>
          Отмена
        </button>
        <button type="button" className="zs-btn zs-danger" onClick={handleDelete} disabled={deleting}>
          {deleting ? "Удаляем…" : "Удалить"}
        </button>
      </ModalFooter>
    </Modal>
  );
}

function ResourcesDialog({ resources, bookings, onClose, onSave, onSaved }) {
  const [rows, setRows] = useState(() => resources.map((r) => ({ ...r })));
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);
  const lastAddedRef = useRef(null);
  const usedIds = useMemo(() => new Set(bookings.map((b) => b.zoomResourceId).filter(Boolean)), [bookings]);

  useEffect(() => {
    if (lastAddedRef.current) {
      const el = document.getElementById(`res-${lastAddedRef.current}`);
      if (el) el.focus();
      lastAddedRef.current = null;
    }
  }, [rows]);

  function change(id, patch) {
    setRows((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));
    setErrors((prev) => ({ ...prev, [id]: undefined }));
  }

  function addRow() {
    const id = `zoom-x-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
    lastAddedRef.current = id;
    setRows((prev) => [...prev, { id, name: "Дополнительный", zoomId: "", active: true, permanent: false }]);
  }

  function removeRow(id) {
    setRows((prev) => prev.filter((r) => r.id !== id));
    setErrors((prev) => ({ ...prev, [id]: undefined }));
  }

  async function handleSave() {
    if (saving) return;
    const next = rows.map((r) => (r.permanent ? r : { ...r, zoomId: r.zoomId.trim().replace(/\s+/g, " ") }));
    const errs = {};
    const seen = new Map();
    next.forEach((r, i) => {
      const digits = zoomDigits(r.zoomId);
      const label = r.permanent ? r.zoomId : `строкой ${i + 1}`;
      if (!r.permanent && !/^\d[\d ]*$/.test(r.zoomId)) errs[r.id] = "Только цифры и пробелы.";
      else if (!r.permanent && (digits.length < 9 || digits.length > 11)) errs[r.id] = "От 9 до 11 цифр.";
      else if (seen.has(digits)) errs[r.id] = `Такой Zoom ID уже есть (${seen.get(digits)}).`;
      else seen.set(digits, label);
    });
    if (Object.keys(errs).length) {
      setErrors(errs);
      return;
    }
    setSaving(true);
    try {
      await onSave(next);
      onSaved();
    } catch (err) {
      setSaveError("Не удалось сохранить. Попробуйте ещё раз.");
      setSaving(false);
    }
  }

  const permanentRows = rows.filter((r) => r.permanent);
  const extraRows = rows.filter((r) => !r.permanent);

  const activeToggle = (r) => (
    <label className="flex items-center gap-1.5 text-sm" style={{ flexShrink: 0, cursor: "pointer", color: r.active ? INK : MUTED }}>
      <input type="checkbox" checked={r.active} onChange={(e) => change(r.id, { active: e.target.checked })} style={{ accentColor: ACCENT, width: 16, height: 16 }} />
      Активен
    </label>
  );

  return (
    <Modal title="Zoom ID" onClose={onClose} width={480}>
      <div onKeyDown={(e) => submitOnEnter(e, handleSave)}>
        <div className="px-6 pt-1" style={{ paddingBottom: 12 }}>
          <p className="text-sm" style={{ color: MUTED, marginTop: 0 }}>
            Постоянные Zoom ID всегда есть в списке. Отключённый ID нельзя выбрать для новых бронирований.
          </p>

          <ul className="rounded-lg border" style={{ borderColor: LINE, listStyle: "none", margin: 0, padding: 0 }}>
            {permanentRows.map((r, i) => (
              <li key={r.id} className="flex items-center justify-between gap-3 px-3" style={{ paddingTop: 7, paddingBottom: 7, borderTop: i ? `1px solid ${LINE}` : "none" }}>
                <span className="tab" style={{ fontSize: 15, fontWeight: 500, color: r.active ? INK : MUTED }}>
                  {r.zoomId}
                </span>
                {activeToggle(r)}
              </li>
            ))}
          </ul>

          <p className="zs-label" style={{ marginTop: 16, marginBottom: 6 }}>Дополнительные</p>
          {extraRows.length === 0 && (
            <p className="text-sm" style={{ color: MUTED, margin: "0 0 6px" }}>Нет. Добавьте, если появится ещё один Zoom ID.</p>
          )}
          <div className="space-y-2">
            {extraRows.map((r) => {
              const inUse = usedIds.has(r.id);
              return (
                <div key={r.id}>
                  <div className="flex items-center gap-3">
                    <input
                      id={`res-${r.id}`}
                      aria-label="Дополнительный Zoom ID"
                      className={`zs-input tab ${errors[r.id] ? "err" : ""}`}
                      style={{ padding: "6px 10px", opacity: r.active ? 1 : 0.55 }}
                      value={r.zoomId}
                      placeholder="123 456 7890"
                      inputMode="numeric"
                      onChange={(e) => change(r.id, { zoomId: e.target.value })}
                    />
                    {activeToggle(r)}
                    <button
                      type="button"
                      className="zs-close"
                      onClick={() => removeRow(r.id)}
                      disabled={inUse}
                      aria-label={`Убрать ${r.zoomId || "пустую строку"}`}
                      title={inUse ? "Используется в бронированиях. Его можно отключить." : "Убрать"}
                      style={{ opacity: inUse ? 0.35 : 1, cursor: inUse ? "not-allowed" : "pointer" }}
                    >
                      <Icon d={ICONS.close} size={16} />
                    </button>
                  </div>
                  {errors[r.id] && <p className="zs-error" style={{ marginBottom: 0 }}>{errors[r.id]}</p>}
                </div>
              );
            })}
          </div>
          <button type="button" className="zs-link" style={{ marginTop: 8, marginLeft: -6 }} onClick={addRow}>
            + Добавить Zoom ID
          </button>

          {saveError && (
            <p role="alert" className="mt-3 rounded-lg px-3 py-2 text-sm" style={{ background: "#FBEAE8", color: "#8F2A24" }}>
              {saveError}
            </p>
          )}
        </div>
        <ModalFooter>
          <button type="button" className="zs-btn zs-secondary" onClick={onClose}>
            Отмена
          </button>
          <button type="button" className="zs-btn zs-primary" onClick={handleSave} disabled={saving}>
            {saving ? "Сохраняем…" : "Сохранить"}
          </button>
        </ModalFooter>
      </div>
    </Modal>
  );
}

function ConfirmImport({ payload, fileName, onCancel, onConfirm, onDone }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const n = payload.bookings.length;

  async function handleConfirm() {
    setBusy(true);
    setError(null);
    try {
      await onConfirm(payload);
      onDone();
    } catch (e) {
      setError("Не удалось сохранить данные. Попробуйте ещё раз.");
      setBusy(false);
    }
  }

  return (
    <Modal title="Заменить расписание данными из файла?" onClose={onCancel} width={420} role="alertdialog">
      <div className="px-6 pt-2 text-sm" style={{ paddingBottom: 20 }}>
        <p style={{ margin: 0, wordBreak: "break-all" }} className="font-medium">{fileName}</p>
        <p style={{ margin: "4px 0 0", color: MUTED }}>
          {n} {plural(n, ["бронирование", "бронирования", "бронирований"])}, {payload.resources.length} Zoom ID.
          Текущие данные будут заменены. Если они нужны, сначала скачайте копию.
        </p>
        {error && (
          <p role="alert" className="mt-3 rounded-lg px-3 py-2" style={{ background: "#FBEAE8", color: "#8F2A24", marginBottom: 0 }}>
            {error}
          </p>
        )}
      </div>
      <ModalFooter>
        <button type="button" className="zs-btn zs-secondary" onClick={onCancel} data-autofocus>
          Отмена
        </button>
        <button type="button" className="zs-btn zs-danger" onClick={handleConfirm} disabled={busy}>
          {busy ? "Загружаем…" : "Заменить"}
        </button>
      </ModalFooter>
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ZoomSchedule />);
